<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase - Admin</title>
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark"); }
    catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="icon" type="image/png" href="./favicon.jpg" />
</head>
<body>

  <header class="topbar">
    <div class="brand"><img style="
    width: 72px;
    height: 72px;
    border-radius: 56px;
" src="./shop ease.jpg" ></div>
    <div class="topbar-right">
      <button type="button" id="themeToggle" class="theme-btn" title="Switch theme" aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <a href="/Shop-Managment/index.html" class="admin-btn">Back to site</a>
      <button type="button" id="logoutBtn" class="admin-btn hidden">Log out</button>
    </div>
  </header>

  <main class="center">

    <!-- ADMIN LOGIN (no signup here) -->
    <div class="card" id="loginCard">
      <form id="adminLoginForm" novalidate>
        <h1>Admin login</h1>
        <p class="sub">Authorized access only</p>

        <label for="adminEmail">Admin email</label>
        <input type="email" id="adminEmail" placeholder="admin@example.com" required autocomplete="email" />

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password" />

        <button type="submit" id="adminLoginBtn">Log in</button>
      </form>
      <div id="message" class="message" role="alert"></div>
    </div>

    <!-- ADMIN DASHBOARD (shown only after admin check passes) -->
    <section class="dashboard hidden" id="dashboard">
      <h1>Admin panel</h1>
      <p class="sub" id="welcomeText"></p>
            <h2 class="section-title">User requests</h2>
      <div class="tabs" id="statusTabs">
        <button type="button" class="tab active" data-status="pending">Pending <span class="count" id="count-pending">0</span></button>
        <button type="button" class="tab" data-status="approved">Approved <span class="count" id="count-approved">0</span></button>
        <button type="button" class="tab" data-status="rejected">Rejected <span class="count" id="count-rejected">0</span></button>
      </div>

      <div class="table-wrap">
        <table class="users-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Signed up</th><th>Action</th></tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
        <p class="empty hidden" id="emptyText">No users here.</p>
      </div>
      <div id="panelMessage" class="message" role="alert"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
