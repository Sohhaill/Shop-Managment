<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>ShopEase - No internet</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #121212; color: #ededed; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 18px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #a8a8a8; margin: 0 0 22px; line-height: 1.5; }
      button { background: #3ecf8e; color: #0b1d14; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div>
      <img src="./assets/icons/icon-192.png" alt="" />
      <h1>Internet nahi hai</h1>
      <p>ShopEase ka data internet se aata hai.<br />Internet chalne par dobara try karo.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
