<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase - Login</title>
    <link rel="icon" type="image/png" href="./assets/favicon.jpg" />
    <script>
      // Set the theme before the page paints (default: dark), so there's no flash
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("theme") || "dark",
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <!-- Top bar with admin icon on the right -->
    <header class="topbar">
      <div class="brand"><img style="
    width: 72px;
    height: 72px;
    border-radius: 56px;
" src="./assets/shop ease.jpg" ></div>
      <div class="topbar-right">
    <button type="button" id="themeToggle" class="theme-btn" title="Switch theme" aria-label="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>

    <a href="./assets/admin.html" class="admin-btn" title="Admin" aria-label="Admin">
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z" />
          <circle cx="12" cy="10" r="2.5" />
          <path d="M7.5 17c.8-2 2.6-3 4.5-3s3.7 1 4.5 3" />
        </svg>
      <span>Admin</span>
    </a>
  </div>
    </header>

    <main class="center">
      <div class="card">
        <!-- LOGIN FORM -->
        <form id="loginForm" novalidate>
          <h1>Welcome back</h1>
          <p class="sub">Log in to manage your shop</p>

          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />

          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />

          <button type="submit" id="loginBtn">Log in</button>

          <p class="switch">
            Don't have an account? <a href="#" id="showSignup">Sign up</a>
          </p>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="hidden" novalidate>
          <h1>Create account</h1>
          <p class="sub">Sign up to get started</p>

          <label for="signupName">Full name</label>
          <input
            type="text"
            id="signupName"
            placeholder="Your name"
            required
            autocomplete="name"
          />

          <label for="signupEmail">Email</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />

          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="At least 6 characters"
            required
            autocomplete="new-password"
          />

          <label for="signupConfirm">Confirm password</label>
          <input
            type="password"
            id="signupConfirm"
            placeholder="Repeat password"
            required
            autocomplete="new-password"
          />

          <button type="submit" id="signupBtn">Sign up</button>

          <p class="switch">
            Already have an account? <a href="#" id="showLogin">Log in</a>
          </p>
        </form>

        <div id="message" class="message" role="alert"></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>
